<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point Customer Florist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--maroon:#6b0f24;--maroon-d:#4a0a19;--rose:#c2475f;--blush:#fbeff1;--bg:#f7ecee;--card:#fff;--text:#3a1520;--muted:#8a6770;--line:#efd6db;--gold:#d9a441;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0a10;--card:#2b1219;--text:#f6e6e9;--muted:#c49aa4;--line:#44202a;--blush:#3a1822}}
:root[data-theme="dark"]{--bg:#1d0a10;--card:#2b1219;--text:#f6e6e9;--muted:#c49aa4;--line:#44202a;--blush:#3a1822}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.5;font-size:13px}
header{position:relative;overflow:hidden;background:radial-gradient(circle at 20% 0,#8c1a35 0,var(--maroon) 45%,var(--maroon-d) 100%);color:#fff;padding:28px 16px 36px;text-align:center}
header h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.5rem,5vw,2.4rem);margin:0;letter-spacing:.5px;color:#fff;position:relative}
header p{max-width:460px;margin:8px auto 0;color:#fff;opacity:.85;position:relative;font-size:.8rem}
.flower{position:absolute;opacity:.16;animation:spin 60s linear infinite}
.f1{width:220px;left:-60px;top:-60px}.f2{width:260px;right:-80px;bottom:-110px;animation-direction:reverse}.f3{width:90px;right:18%;top:14px}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:700px;margin:-22px auto 32px;padding:0 16px;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 8px 22px rgba(107,15,36,.12);transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(107,15,36,.2)}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--rose)}
.stat span{font-size:.72rem;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 26px rgba(107,15,36,.1);margin-bottom:16px}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
input{font:inherit;color:var(--text);background:var(--blush);border:2px solid transparent;font-size:.85rem;border-radius:10px;padding:8px 12px;outline:none;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(194,71,95,.18)}
.btn{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#8c1a35,var(--maroon));border:0;font-size:.85rem;border-radius:10px;padding:8px 16px;cursor:pointer;transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 18px rgba(107,15,36,.4);filter:brightness(1.1)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.pm:focus-visible,.del:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:520px}
th{background:linear-gradient(135deg,#8c1a35,var(--maroon));color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:.78rem}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{background:var(--blush);padding:8px 12px;transition:background .2s,transform .2s}
td:first-child{border-radius:12px 0 0 12px;font-weight:600}td:last-child{border-radius:0 12px 12px 0}
tbody tr{transition:transform .2s,filter .2s}
tbody tr:hover{transform:scale(1.012)}tbody tr:hover td{background:#f6d9df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tbody tr:hover td{background:#4c2230}}
:root[data-theme="dark"] tbody tr:hover td{background:#4c2230}
.qty{display:inline-flex;align-items:center;gap:10px}
.pm{width:27px;height:27px;border-radius:50%;border:0;font-size:1rem;line-height:1;font-weight:600;color:#fff;background:var(--maroon);cursor:pointer;transition:transform .15s,background .2s}
.pm:hover:not(:disabled){transform:scale(1.18) rotate(8deg);background:var(--rose)}
.pm:active:not(:disabled){transform:scale(.88)}
.pm:disabled{opacity:.35;cursor:not-allowed}
.n{min-width:28px;text-align:center;font-weight:600;font-size:.95rem}
.pts b{color:var(--rose);font-size:.95rem}
.bar{height:7px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:9px;transition:width .4s}
.max{font-size:.72rem;background:var(--gold);color:#3a1520;border-radius:20px;padding:1px 8px;margin-left:6px;font-weight:600}
.del{background:none;border:0;cursor:pointer;font-size:.95rem;opacity:.5;transition:opacity .2s,transform .2s;color:var(--text)}
.del:hover{opacity:1;transform:scale(1.25)}
.del.ask{opacity:1;background:var(--maroon);color:#fff;border-radius:8px;font-size:.72rem;padding:4px 9px;font-weight:600}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.35)}}
.empty{text-align:center;color:var(--muted);padding:26px}
.note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:6px}
@media (max-width:620px){.add{grid-template-columns:1fr}.stats{gap:8px}.stat b{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="fl" viewBox="0 0 100 100"><g fill="#fff"><ellipse cx="50" cy="22" rx="14" ry="22"/><ellipse cx="50" cy="22" rx="14" ry="22" transform="rotate(72 50 50)"/><ellipse cx="50" cy="22" rx="14" ry="22" transform="rotate(144 50 50)"/><ellipse cx="50" cy="22" rx="14" ry="22" transform="rotate(216 50 50)"/><ellipse cx="50" cy="22" rx="14" ry="22" transform="rotate(288 50 50)"/></g><circle cx="50" cy="50" r="9" fill="#d9a441"/></symbol></defs></svg>
<header>
<svg class="flower f1"><use href="#fl"/></svg><svg class="flower f2"><use href="#fl"/></svg><svg class="flower f3"><use href="#fl"/></svg>
<h1>Point Customer Florist</h1>
<p>Setiap 1 pesanan, customer akan mendapatkan 50 poin. Kumpulkan 500 poin untuk mendapatkan voucher diskon.</p>
</header>
<main>
<section class="stats">
<div class="stat"><b id="sC">0</b><span>Customer</span></div>
<div class="stat"><b id="sO">0</b><span>Total pesanan</span></div>
<div class="stat"><b id="sP">0</b><span>Total poin dibagikan</span></div>
</section>
<section class="panel">
<div class="add">
<input id="nm" placeholder="Nama customer" autocomplete="off">
<input id="hp" placeholder="Nomor handphone" inputmode="tel" autocomplete="off">
<button class="btn" id="addBtn">+ Tambah customer</button>
</div>
<div class="note" id="msg"></div>
</section>
<section class="panel tw">
<table>
<thead><tr><th>Nama customer</th><th>Nomor handphone</th><th>Jumlah pemesanan</th><th>Total poin</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
</section>
</main>
<script>
var PER=50,MAX=500,MAXO=MAX/PER,KEY='florist_points_v1',askId=0,askT;
var data=[{id:1,name:'Contoh Customer',phone:'081234567890',orders:2}];
try{var s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pts(o){return Math.min(o*PER,MAX)}
function render(pop){
var h='';
data.forEach(function(r){
var p=pts(r.orders);
h+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.phone)+'</td>'
+'<td><span class="qty"><button class="pm" data-a="m" data-id="'+r.id+'" aria-label="Kurangi pesanan"'+(r.orders<=0?' disabled':'')+'>−</button>'
+'<span class="n'+(pop===r.id?' pop':'')+'">'+r.orders+'</span>'
+'<button class="pm" data-a="p" data-id="'+r.id+'" aria-label="Tambah pesanan"'+(r.orders>=MAXO?' disabled':'')+'>+</button></span></td>'
+'<td class="pts"><b>'+p+'</b> poin'+(p>=MAX?'<span class="max">Maks</span>':'')+'<div class="bar"><i style="width:'+p/MAX*100+'%"></i></div></td>'
+'<td><button class="del'+(askId===r.id?' ask':'')+'" data-a="d" data-id="'+r.id+'" aria-label="Hapus customer">'+(askId===r.id?'Hapus?':'🗑')+'</button></td></tr>';
});
document.getElementById('rows').innerHTML=h||'<tr><td colspan="5" class="empty">Belum ada customer. Tambahkan customer pertama di atas.</td></tr>';
var o=0,t=0;data.forEach(function(r){o+=r.orders;t+=pts(r.orders)});
document.getElementById('sC').textContent=data.length;
document.getElementById('sO').textContent=o;
document.getElementById('sP').textContent=t;
}
document.getElementById('rows').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
var id=+b.dataset.id,i=data.findIndex(function(r){return r.id===id});if(i<0)return;
if(b.dataset.a==='p'&&data[i].orders<MAXO)data[i].orders++;
else if(b.dataset.a==='m'&&data[i].orders>0)data[i].orders--;
else if(b.dataset.a==='d'){if(askId!==id){askId=id;clearTimeout(askT);askT=setTimeout(function(){askId=0;render()},3000);render();return}clearTimeout(askT);askId=0;data.splice(i,1);id=0}
save();render(id);
});
function add(){
var n=document.getElementById('nm'),p=document.getElementById('hp'),m=document.getElementById('msg');
if(!n.value.trim()||!p.value.trim()){m.textContent='Isi nama dan nomor handphone dulu.';return}
data.push({id:Date.now(),name:n.value.trim(),phone:p.value.trim(),orders:0});
n.value='';p.value='';m.textContent='Customer ditambahkan.';save();render();n.focus();
}
document.getElementById('addBtn').onclick=add;
['nm','hp'].forEach(function(i){document.getElementById(i).addEventListener('keydown',function(e){if(e.key==='Enter')add()})});
render();
</script>
</body>
</html>
